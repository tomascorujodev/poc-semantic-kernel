<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Support Assistant</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #e2e5eb;
      --accent: #2f6fed; --accent-text: #ffffff; --user-bg: #2f6fed; --user-text: #ffffff;
      --tool-bg: #f1f3f7; --cite-bg: #e6efff; --cite-text: #1f4fb8; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --panel: #1a1d24; --text: #e6e8ee; --muted: #9aa1b2; --border: #2c313c;
        --accent: #5b8cff; --user-bg: #3a63c7; --tool-bg: #232731; --cite-bg: #22324f; --cite-text: #9dbbff;
        --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 820px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    .ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .tools { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .tools:empty { display: none; }
    details.tool { background: var(--tool-bg); border-radius: 6px; padding: 4px 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); }
    details.tool summary { cursor: pointer; }
    details.tool pre { margin: 4px 0 0; white-space: pre-wrap; }
    .cite { display: inline-block; background: var(--cite-bg); color: var(--cite-text); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; }
    .error { color: var(--error); }
    .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
    .suggestions button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; font-size: 13px; }
    form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
    input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .send { background: var(--accent); color: var(--accent-text); border: none; padding: 10px 16px; }
    .send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Store Support Assistant</h1>
        <p>Semantic Kernel · Azure OpenAI · plugins + RAG</p>
      </div>
      <button class="ghost" id="reset" type="button">New chat</button>
    </header>

    <main id="messages" aria-live="polite"></main>

    <div class="suggestions" id="suggestions">
      <button type="button">Can I return an opened laptop?</button>
      <button type="button">What orders does Ana García have?</button>
      <button type="button">Is order 40 still under warranty?</button>
      <button type="button">Do you ship to the USA?</button>
    </div>

    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask about orders, returns, warranty, shipping…" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    // One id per browser tab: the server keeps one ChatHistory per session id.
    const newSessionId = () => crypto.randomUUID();
    let sessionId = newSessionId();

    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Escapes the text, then turns **bold** into <strong> and [file.md] citations into badges.
    const render = text => escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([\w.-]+\.md)\]/g, '<span class="cite">📄 $1</span>');

    function addMessage(role, html) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.innerHTML = html;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function addToolCall(container, name, args) {
      const d = document.createElement("details");
      d.className = "tool";
      const argText = Object.entries(args).map(([k, v]) => `${k}=${v}`).join(", ");
      d.innerHTML = `<summary>🔧 ${escapeHtml(name)}(${escapeHtml(argText)})</summary><pre>…</pre>`;
      container.appendChild(d);
      return d;
    }

    // Reads the server-sent events from a POST response (EventSource only supports GET).
    async function* readEvents(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) return;
        buffer += decoder.decode(value, { stream: true });
        let end;
        while ((end = buffer.indexOf("\n\n")) >= 0) {
          const raw = buffer.slice(0, end);
          buffer = buffer.slice(end + 2);
          let type = "message", data = "";
          for (const line of raw.split("\n")) {
            if (line.startsWith("event: ")) type = line.slice(7);
            else if (line.startsWith("data: ")) data += line.slice(6);
          }
          yield { type, data: JSON.parse(data || "{}") };
        }
      }
    }

    async function ask(question) {
      addMessage("user", escapeHtml(question));
      const bubble = addMessage("assistant", '<div class="tools"></div><div class="text typing"></div>');
      const tools = bubble.querySelector(".tools");
      const textEl = bubble.querySelector(".text");
      let text = "", lastTool = null;
      send.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: question }),
        });
        for await (const { type, data } of readEvents(response)) {
          if (type === "tool") lastTool = addToolCall(tools, data.name, data.args);
          else if (type === "toolResult" && lastTool) lastTool.querySelector("pre").textContent = data.preview;
          else if (type === "token") { text += data.text; textEl.innerHTML = render(text); }
          else if (type === "error") textEl.innerHTML = `<span class="error">⚠ ${escapeHtml(data.message)}</span>`;
          messages.scrollTop = messages.scrollHeight;
        }
      } catch (err) {
        textEl.innerHTML = `<span class="error">⚠ Connection error: ${escapeHtml(err.message)}</span>`;
      } finally {
        textEl.classList.remove("typing");
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question || send.disabled) return;
      input.value = "";
      ask(question);
    });

    document.getElementById("suggestions").addEventListener("click", e => {
      if (e.target.tagName === "BUTTON" && !send.disabled) ask(e.target.textContent);
    });

    document.getElementById("reset").addEventListener("click", async () => {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      sessionId = newSessionId();
      messages.innerHTML = "";
      input.focus();
    });

    input.focus();
  </script>
</body>
</html>
